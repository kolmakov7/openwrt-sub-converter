name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} / ${{ matrix.variant }} (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: arm_cortex-a9,          variant: snapshot,     sdk: arm_cortex-a9-main }
          - { label: arm_cortex-a9,          variant: openwrt-24.10, sdk: arm_cortex-a9-openwrt-24.10 }
          - { label: aarch64_cortex-a53,     variant: snapshot,     sdk: aarch64_cortex-a53-main }
          - { label: aarch64_cortex-a53,     variant: openwrt-24.10, sdk: aarch64_cortex-a53-openwrt-24.10 }
          - { label: mips64el_mips64r2,      variant: snapshot,     sdk: mips64el_mips64r2-main }
          - { label: mips64el_mips64r2,      variant: openwrt-24.10, sdk: mips64el_mips64r2-openwrt-24.10 }
          - { label: mipsel_24kc,            variant: snapshot,     sdk: mipsel_24kc-main }
          - { label: mipsel_24kc,            variant: openwrt-24.10, sdk: mipsel_24kc-openwrt-24.10 }
          - { label: x86_64,                 variant: snapshot,     sdk: x86_64-main }
          - { label: x86_64,                 variant: openwrt-24.10, sdk: x86_64-openwrt-24.10 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: subconverter
          PACKAGES: sub-converter luci-app-sub-converter

      - name: Verify packages were built
        env:
          FEEDNAME: subconverter
        run: sh .github/scripts/verify-built-packages.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.variant }}-packages
          path: |
            bin/packages/**/subconverter/sub-converter*
            bin/packages/**/subconverter/luci-app-sub-converter*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Bundle per-architecture package archives
        run: |
          chmod +x .github/scripts/bundle-arch-packages.sh
          sh .github/scripts/bundle-arch-packages.sh arm_cortex-a9 aarch64_cortex-a53 mips64el_mips64r2 mipsel_24kc x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sub-converter-*-packages.tar.gz
          generate_release_notes: true
