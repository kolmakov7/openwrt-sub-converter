name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} / ${{ matrix.variant }} (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: aarch64_cortex-a53
            variant: snapshot
            sdk: aarch64_cortex-a53-main
          - label: aarch64_cortex-a53
            variant: openwrt-24.10
            sdk: aarch64_cortex-a53-openwrt-24.10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: sub-converter
          PACKAGES: sub-converter luci-app-sub-converter

      - name: Verify packages were built
        env:
          FEEDNAME: sub-converter
        run: sh .github/scripts/verify-built-packages.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.variant }}-packages
          path: |
            bin/packages/**/sub-converter/sub-converter*
            bin/packages/**/sub-converter/luci-app-sub-converter*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Bundle per-architecture package archives
        run: |
          chmod +x .github/scripts/bundle-arch-packages.sh
          sh .github/scripts/bundle-arch-packages.sh aarch64_cortex-a53

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sub-converter-*-packages.tar.gz
          generate_release_notes: true
